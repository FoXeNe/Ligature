[package]
name = "notes-app"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# WebKitGTK integration: pinch gesture (src/pinch.rs) and tuning (src/webkit_tune.rs).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
